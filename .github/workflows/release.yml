name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.2.0 or v0.2.0)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine release version and tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_INPUT="${{ inputs.version }}"
          else
            RAW_INPUT="${GITHUB_REF#refs/tags/}"
          fi

          # Strip leading 'v'
          VERSION="${RAW_INPUT#v}"
          TAG="v${VERSION}"

          # Semver validation
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid semver version: '$RAW_INPUT'"
            exit 1
          fi

          # Check if prerelease
          if echo "$VERSION" | grep -q '-'; then
            PRERELEASE="true"
          else
            PRERELEASE="false"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "Release target: version=${VERSION}, tag=${TAG}, prerelease=${PRERELEASE}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Bump version numbers across workspace
        run: |
          python3 scripts/bump-version.py "${{ steps.vars.outputs.version }}"

      - name: Commit and push version bump and tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Cargo.toml Cargo.lock flake.nix crates/

          if ! git diff --cached --quiet; then
            git commit -m "chore(release): ${TAG}"
            git push origin "HEAD:${{ github.ref_name }}"
          else
            echo "Working tree clean; no version diff to commit."
          fi

          # Tag the release commit and push tag
          git tag -fa "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}" --force

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Set up Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Build cm-rs with Nix
        run: |
          nix build .#cm-rs --print-build-logs

      - name: Package release distribution
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          mkdir -p dist

          # Package the build output into tarball dereferencing symlinks
          tar -czvhf "dist/cm-rs-${TAG}-linux-x86_64.tar.gz" -C result .

          # Generate SHA256 checksums
          cd dist
          sha256sum *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: cm-rs-${{ steps.vars.outputs.tag }}-linux-x86_64
          path: dist/*
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.tag }}
          prerelease: ${{ steps.vars.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            dist/*
