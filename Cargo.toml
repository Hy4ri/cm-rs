[workspace]
resolver = "2"
members = ["crates/ac-core", "crates/cm-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MS-PL"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8.23"
tempfile = "3"
dirs = "6"
zip = { version = "2", default-features = false, features = ["deflate"] }
gpui = "0.2.2"
unicode-segmentation = "1"

[profile.release]
lto = "thin"
